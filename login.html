<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>會員登入｜訊誆</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="images/logo.webp">

    <script src="javascript/login.js"></script>
</head>

<body>
    <div class="scanline"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="訊誆 Logo">
        </a>

        <nav>
            <a href="index.html">首頁</a>
            <a href="shop.html">周邊商城</a>
            <a href="download.html">免費遊玩</a>
        </nav>

        <div class="user-actions">
            <a href="login.html" class="login-btn"> 登入 </a>
        </div>
    </header>

    <div class="login-background">
        <div class="background-glow"></div>
    </div>

    <main class="login-page">
        <div class="login-panel">
            <span class="section-tag">
                MEMBER SYSTEM
            </span>

            <h1> 身分驗證 </h1>

            <p class="login-description"> 請登入你的帳號，以連接《訊誆》會員系統。 </p>

            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label> ACCOUNT </label>

                    <input
                        type="text"
                        id="account"
                        placeholder="輸入帳號">
                </div>

                <div class="input-group">
                    <label> PASSWORD </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="輸入密碼">
                </div>

                <button type="submit" class="primary-btn login-submit"> CONNECT </button>
            </form>

            <div class="login-extra">
                <a href="#"> 建立帳號 </a>
                <a href="#"> 忘記密碼 </a>
            </div>
        </div>
    </main>
</body>
</html>
