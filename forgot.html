<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>忘記密碼｜訊誆</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/user.css">
    <link rel="icon" href="images/logo.webp">

    <script src="javascript/forgot.js" defer></script>
    <script src="javascript/auth.js" defer></script>
</head>

<body>
    <div class="scanline"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="訊誆 Logo">
        </a>

        <nav>
            <a href="index.html">首頁</a>
            <a href="shop.html">周邊商城</a>
            <a href="download.html">免費遊玩</a>
        </nav>
    </header>

    <div class="login-background">
        <div class="background-glow"></div>
    </div>

    <main class="login-page">
        <div class="login-panel">
            <span class="section-tag"> PASSWORD RECOVERY </span>

            <h1> 重設密碼 </h1>

            <p class="login-description"> 請輸入您的帳號與註冊暱稱以驗證身分並重設密碼。 </p>

            <form class="login-form" id="forgot-form">
                <div class="input-group">
                    <label> ACCOUNT </label>
                    <input type="text" id="forgot-account" placeholder="輸入您的帳號" required>
                </div>

                <div class="input-group">
                    <label> PLAYER NAME </label>
                    <input type="text" id="forgot-name" placeholder="輸入註冊時填寫的暱稱" required>
                </div>

                <div class="input-group">
                    <label> NEW PASSWORD </label>
                    <input type="password" id="forgot-new-password" placeholder="設定您的全新密碼" required>
                </div>

                <button type="submit" class="primary-btn login-submit" id="forgot-submit"> 重設密碼 </button>
            </form>

            <div class="login-extra">
                <a href="login.html"> 返回登入頁面 </a>
            </div>
        </div>
    </main>
</body>
</html>
