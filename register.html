<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>建立新帳號｜訊誆</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/user.css"> <link rel="icon" href="images/logo.webp">

    <script src="javascript/register.js" defer></script>
    <script src="javascript/auth.js" defer></script>
</head>

<body>
    <div class="scanline"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="訊誆 Logo">
        </a>

        <nav>
            <a href="index.html">首頁</a>
            <a href="shop.html">周邊商城</a>
            <a href="download.html">免費遊玩</a>
        </nav>
    </header>

    <div class="login-background">
        <div class="background-glow"></div>
    </div>

    <main class="login-page">
        <div class="login-panel">
            <span class="section-tag"> MEMBER REGISTER </span>

            <h1> 建立帳號 </h1>

            <p class="login-description"> 請填寫以下欄位，以註冊成為《訊誆》會員。 </p>

            <form class="login-form" id="register-form">
                <div class="input-group">
                    <label> 稱呼 </label>
                    <input
                        type="text"
                        id="reg-name"
                        placeholder="輸入你的暱稱（選填）">
                </div>

                <div class="input-group">
                    <label> 帳號 </label>
                    <input
                        type="text"
                        id="reg-account"
                        placeholder="設定你的登入帳號">
                </div>

                <div class="input-group">
                    <label> 密碼 </label>
                    <input
                        type="password"
                        id="reg-password"
                        placeholder="設定你的密碼">
                </div>

                <button type="submit" class="primary-btn login-submit" id="reg-submit"> 註冊帳號 </button>
            </form>

            <div class="login-extra">
                <a href="login.html"> 已有帳號？立即登入 </a>
            </div>
        </div>
    </main>
</body>
</html>
